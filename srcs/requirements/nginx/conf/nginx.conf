worker_processes 1;

events{
	worker_connections 1024;
}

http{
	include /etc/nginx/mime.types; # line 334
	default_type application/octet-stream;

	server {
	listen 443 ssl;      # IPv4
	listen [::]:443 ssl; # IPv6


	server_name dacastil.42.fr;

	# Certificate paths
	ssl_certificate     /etc/nginx/ssl/nginx.crt;
	ssl_certificate_key /etc/nginx/ssl/nginx.key;

	# TLS protocol — only TLSv1.2 and TLSv1.3 for HTTPS
	ssl_protocols TLSv1.2 TLSv1.3;

	ssl_ciphers HIGH:!aNULL:!MD5;

	root  /var/www/html;
	index index.php index.html;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}
	# FastCGI — proxy PHP requests to WordPress
	location ~ \.php$ {
		# wordpress = service name in docker-compose.yml
		# 9000      = port where php-fpm listens
		fastcgi_pass  wordpress:9000;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME
		              $document_root$fastcgi_script_name;
		include       fastcgi_params;
	}
	 location ~ /\.ht {
		deny all;
	}
	}
}
