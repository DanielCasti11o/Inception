[www]

user = www-data
group = www-data

; Escuchar en TCP en lugar de socket Unix.
; NGINX se conectará a wordpress:9000 desde otro contenedor.
listen = 0.0.0.0:9000

; Modo de gestión de procesos
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

php_admin_value[error_log] = /dev/stderr ; Redirige los logs de errores a la consola
php_admin_flag[log_errors] = on

chdir = /var/www/html
