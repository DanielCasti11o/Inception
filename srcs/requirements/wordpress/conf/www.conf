[www]

user = www-data
group = www-data

; Listen on TCP instead of Unix socket.
; NGINX connects to wordpress:9000 from another container.
listen = 0.0.0.0:9000

; Process management mode
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

php_admin_value[error_log] = /dev/stderr ; Redirect error logs to console
php_admin_flag[log_errors] = on

chdir = /var/www/html
