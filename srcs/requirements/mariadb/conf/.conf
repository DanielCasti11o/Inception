[mysqld]
# Listen on all Docker network interfaces
bind-address = 0.0.0.0

# Standard MySQL/MariaDB port
port = 3306

# Data directory (mounted volume)
datadir = /var/lib/mysql

# Socket for local connections (used by mysqladmin)
socket = /run/mysqld/mysqld.sock

[client]
# Client also uses the local socket
socket = /run/mysqld/mysqld.sock
