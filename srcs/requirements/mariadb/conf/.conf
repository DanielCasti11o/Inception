[mysqld]
# Escuchar en todas las interfaces de la red Docker
bind-address    = 0.0.0.0

# Puerto estándar de MySQL/MariaDB
port            = 3306

# Directorio donde se guardan los datos (volumen montado)
datadir         = /var/lib/mysql

# Socket para conexiones locales (usado por mysqladmin)
socket          = /run/mysqld/mysqld.sock

[client]
# El cliente también usa el socket local
socket          = /run/mysqld/mysqld.sock
