# service orchestrator

# Starts all services and automatically creates the bridge network
version: '3.8'

services:
  nginx:
    build: ./requirements/nginx # NGINX Dockerfile path
    container_name: nginx
    networks:
      - inception
    ports:
      - "443:443"
    restart: always # Restart policy
    env_file: .env
    volumes:
      - wp-files:/var/www/html
    depends_on:
      - wordpress

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env # Include environments.
    secrets:
      - db_password
      - wp_passwd
      - wp_admin_passwd
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WP_URL=${DOMAIN_NAME}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - WP_USPASSWD_FILE=/run/secrets/wp_passwd
      - WP_ADMPASSWD_FILE=/run/secrets/wp_admin_passwd
    networks:
      - inception
    volumes:
      - wp-files:/var/www/html
    restart: always

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    expose:
      - "3306"
    secrets:
      - db_password
      - db_root_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
    networks:
      - inception
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: always

# Network type: bridge
networks:
  inception:
    driver : bridge

# Docker secrets — stores passwords and sensitive environment variables

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
  wp_passwd:
    file: ./secrets/wp_passwd.txt
  wp_admin_passwd:
    file: ./secrets/wp_admin_passwd.txt

# Named volumes — persistent data storage

volumes:
  wp-files:
    driver_opts:
      type: none
      device: /home/dacastil/data/wordpress
      o: bind
  mariadb-data:
    driver_opts:
      type: none
      device: /home/dacastil/data/mariadb
      o: bind

