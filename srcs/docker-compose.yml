# orquestador de servicios

# Se encargará de levantar los servicios.
# También crea automáticamente la bridge dónde estarán los servicios
version: '3.8'

services:
  nginx:
    build: ./requirements/nginx # Ruta dockerfile NGINX
    container_name: nginx
    networks:
      - inception
    ports:
      - "443:443"
    restart: always # Restart: Policy "Apuntes.md, lines 31-37"
    env_file: .env
    volumes:
      -wp-files:/var/www/html
    depends_on:
      -wordpress

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env # Include environments.
    secrets:
      - db_password
      - wp_passwd
      - wp_admin_passwd
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WP_URL=${DOMAIN_NAME}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - WP_USPASSWD_FILE=/run/secrets/wp_passwd
      - WP_ADMPASSWD_FILE=/run/secrets/wp_admin_passwd
    networks:
      - inception
    restart: always

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    expose:
      - "3306"
    secrets: # Aqui añadimos los secretos de compose
      - db_password
      - db_root_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE} # Name of environments.
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
    networks:
      - inception
    restart: always

# Aqui estoy definiendo el tipo de network que usaremos, en este caso
# bridge.
networks:
  inception:
    driver : bridge

# Aqui definiré los secrets, que será donde guardaré las
# contraseñas y variables de entorno confidenciales

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
  wp_passwd:
    file: ./secrets/wp_passwd.txt
  wp_admin_passwd:
    file: ./secrets/wp_admin_passwd.txt
